<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screenwork</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Screenwork</div>
      <label class="button primary">
        上传
        <input id="uploadInput" type="file" accept="image/png,.png" multiple hidden />
      </label>
      <a class="button ghost" href="/upload.html">上传页</a>
      <select id="statusFilter" class="control" aria-label="状态">
        <option value="">全部状态</option>
        <option value="new">新截图</option>
        <option value="reviewing">整理中</option>
        <option value="ready">可开发</option>
        <option value="developing">开发中</option>
        <option value="done">已完成</option>
      </select>
      <button id="settingsButton" class="button ghost">设置</button>
      <div id="statusText" class="status">就绪</div>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-head">
            <strong>分类</strong>
            <button id="newRootButton" class="small-button">+</button>
          </div>
          <div id="categoryTree" class="tree"></div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-head">
            <strong>工作</strong>
            <button id="newWorkButton" class="small-button">+</button>
          </div>
          <div id="workGroupList" class="tree"></div>
        </div>
      </aside>

      <section class="content">
        <div class="toolbar">
          <div class="toolbar-group toolbar-search">
            <div class="search-box">
              <input id="searchInput" class="control search" placeholder="搜索标题 / 内容 / TAG，双空格生成标记" />
              <div id="searchTokens" class="search-tokens"></div>
            </div>
            <select id="timeSort" class="control compact-control" aria-label="时间排序">
              <option value="newest">最新优先</option>
              <option value="oldest">最早优先</option>
            </select>
            <select id="priorityFilter" class="control compact-control" aria-label="优先级">
              <option value="">全部优先级</option>
              <option value="高价值">高价值</option>
              <option value="待验证">待验证</option>
              <option value="可立即开发">可立即开发</option>
            </select>
            <label class="inline-check toolbar-check">
              <input id="starredFilter" type="checkbox" />
              星标
            </label>
            <label class="inline-check toolbar-check">
              <input id="noContentFilter" type="checkbox" />
              无内容
            </label>
          </div>
          <div class="toolbar-group toolbar-actions">
            <button id="refreshButton" class="button">刷新</button>
            <button id="cancelSelectionButton" class="button">取消</button>
            <button id="deleteSelectedButton" class="button danger-button">删除</button>
            <button id="organizeSelectedButton" class="button">AI整理选中</button>
            <select id="exportFormat" class="control compact-control" aria-label="导出格式">
              <option value="zip">ZIP 完整包</option>
              <option value="markdown">Markdown</option>
              <option value="excel">Excel</option>
              <option value="notion">Notion CSV</option>
            </select>
            <button id="exportButton" class="button">导出选中</button>
          </div>
          <div class="toolbar-group toolbar-views">
            <button id="listViewButton" class="button primary">列表</button>
            <button id="imageBoardButton" class="button">图片看板</button>
            <button id="timelineViewButton" class="button">时间线</button>
            <button id="workBoardButton" class="button">工作看板</button>
          </div>
        </div>

        <section id="aiJobPanel" class="task-panel">
          <div class="task-panel-head">
            <strong>AI识别任务</strong>
            <button id="refreshJobsButton" class="small-button" type="button">↻</button>
          </div>
          <div id="aiJobList" class="task-list">
            <div class="empty-line">还没有批量识别任务</div>
          </div>
        </section>

        <div class="workarea">
          <section class="image-panel">
            <div id="imageGrid" class="image-grid"></div>
            <div class="list-footer">
              <span id="imageListMeta">显示 0 / 0</span>
              <button id="loadMoreImagesButton" class="button" type="button">加载更多</button>
            </div>
          </section>

          <article id="detailPanel" class="detail empty">
            <div class="empty-state">选择一张截图开始整理</div>
          </article>
        </div>
      </section>
    </main>

    <div id="imageLightbox" class="lightbox" hidden>
      <div class="lightbox-toolbar">
        <a id="lightboxDownload" class="button primary" href="#" download>下载</a>
        <a id="lightboxOriginal" class="button" href="#" target="_blank" rel="noreferrer">原始图片</a>
        <button id="lightboxInfoButton" class="button" type="button">图片信息</button>
        <button id="lightboxClose" class="button" type="button">关闭</button>
      </div>
      <div id="lightboxStage" class="lightbox-stage">
        <div id="lightboxImageWrap" class="lightbox-image-wrap">
          <img id="lightboxImage" alt="" />
          <svg id="lightboxAnnotationSvg" class="annotation-overlay"></svg>
        </div>
      </div>
      <aside id="lightboxInfo" class="lightbox-info" hidden></aside>
    </div>

    <div id="annotationEditor" class="annotation-editor" hidden>
      <div class="annotation-toolbar">
        <button id="annotationBoxTool" class="button primary" type="button">画框</button>
        <button id="annotationArrowTool" class="button" type="button">箭头</button>
        <label class="annotation-color-label">颜色<input id="annotationColor" type="color" value="#f97316" /></label>
        <input id="annotationTextInput" class="control annotation-text-input" placeholder="文字备注" />
        <button id="annotationTextTool" class="button" type="button">添加文字</button>
        <button id="annotationUndo" class="button" type="button">撤销</button>
        <button id="annotationSave" class="button primary" type="button">保存</button>
        <button id="annotationClose" class="button" type="button">关闭</button>
      </div>
      <div class="annotation-stage">
        <div class="annotation-canvas-wrap">
          <img id="annotationImage" alt="" />
          <svg id="annotationSvg"></svg>
        </div>
        <aside class="annotation-side">
          <h2>局部标注</h2>
          <div id="annotationList" class="annotation-list"></div>
        </aside>
      </div>
    </div>

    <dialog id="settingsDialog" class="modal">
      <form method="dialog" class="modal-body">
        <h2>设置</h2>
        <section class="settings-section">
          <h3>Metapi</h3>
          <label>Metapi 地址<input id="metapiBaseUrl" class="control" placeholder="http://127.0.0.1:3000" /></label>
          <label>模型名<input id="metapiModel" class="control" placeholder="alibaba/qwen3-vl-plus" /></label>
          <label>图片整理模型列表<textarea id="metapiModels" class="control model-list-input" placeholder="一行一个模型，失败后自动切换下一个"></textarea></label>
          <label>多模型对比列表<textarea id="metapiCompareModels" class="control model-list-input" placeholder="一行一个模型，用于人工对比"></textarea></label>
          <label>失败重试次数<input id="metapiRetryAttempts" class="control" type="number" min="1" max="50" step="1" placeholder="10" /></label>
          <label>接口类型
            <select id="metapiProvider" class="control">
              <option value="openai">OpenAI Compatible</option>
              <option value="claude">Claude Compatible</option>
            </select>
          </label>
          <label>API Key<input id="metapiApiKey" class="control" type="password" placeholder="留空则使用环境变量" /></label>
        </section>
        <section class="settings-section">
          <h3>备份恢复</h3>
          <div class="backup-actions">
            <button id="createBackupButton" class="button" type="button">创建备份</button>
            <label class="restore-file">恢复文件<input id="restoreInput" class="control" type="file" accept=".zip,application/zip" /></label>
            <button id="restoreBackupButton" class="button danger-button" type="button">恢复备份</button>
          </div>
          <div id="backupStatus" class="backup-status"></div>
          <div id="backupList" class="backup-list"></div>
        </section>
        <div class="modal-actions">
          <button id="saveSettingsButton" class="button primary" value="default">保存</button>
          <button class="button" value="cancel">关闭</button>
        </div>
      </form>
    </dialog>

    <dialog id="modelCompareDialog" class="modal compare-modal">
      <form method="dialog" class="modal-body">
        <h2>多模型对比</h2>
        <div id="modelCompareStatus" class="backup-status"></div>
        <div id="modelCompareList" class="compare-list"></div>
        <div class="modal-actions">
          <button class="button" value="cancel">关闭</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
