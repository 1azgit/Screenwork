services:
  screenwork:
    build: .
    container_name: screenwork
    restart: unless-stopped
    ports:
      - "26633:26633"
    environment:
      SCREENWORK_DATA_DIR: /app/data
      METAPI_BASE_URL: ${METAPI_BASE_URL:-}
      METAPI_MODEL: ${METAPI_MODEL:-alibaba/qwen3-vl-plus}
      METAPI_MODELS: ${METAPI_MODELS:-alibaba/qwen3-vl-plus,alibaba/qwen3-vl-flash,alibaba/qwen3-vl-235b-a22b-instruct,alibaba/qwen3-vl-235b-a22b-thinking,alibaba/qwen-vl-max,qwen-vision-pro,glm-5v-turbo,glm-4v,deepseek-v4-vision,meta/llama-3.2-90b-vision-instruct}
      METAPI_COMPARE_MODELS: ${METAPI_COMPARE_MODELS:-alibaba/qwen3-vl-plus,glm-5v-turbo,deepseek-v4-vision}
      METAPI_RETRY_ATTEMPTS: ${METAPI_RETRY_ATTEMPTS:-10}
      METAPI_PROVIDER: ${METAPI_PROVIDER:-openai}
      METAPI_API_KEY: ${METAPI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
